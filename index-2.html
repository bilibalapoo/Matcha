<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="抹茶記錄冊">
<title>抹茶記錄冊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #131510;
  --card: #1c211b;
  --card-2: #1f231d;
  --elev: #22271f;
  --line: #2a3028;
  --text: #ecefe8;
  --muted: #8b9086;
  --dim: #6a7066;
  --green: #76b682;
  --green-2: #5fb87e;
  --green-d: #3a5c42;
  --green-soft: #2a3b2c;
  --pill: #2a2e29;
  --nav: #1c1f19;
  --danger: #c47a6a;
  --phone-w: 402px;
  --phone-h: 874px;
  --sb: 62px;
  --tb: 83px;
  --radius-screen: 55px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: "PingFang HK", "PingFang TC", "Noto Sans TC", -apple-system, BlinkMacSystemFont, sans-serif;
  background: #0a0c09;
  color: var(--text);
  overflow: hidden;
}
.stage {
  min-height: 100%;
  display: grid;
  place-items: center;
  padding: 24px;
  background:
    radial-gradient(ellipse at 50% 0%, #1a2418 0%, #0a0c09 55%);
}
.phone {
  width: var(--phone-w);
  height: var(--phone-h);
  position: relative;
  border-radius: 62px;
  background: #000;
  box-shadow:
    0 0 0 3px #2a2c28,
    0 0 0 5px #1a1c18,
    0 28px 80px rgba(0,0,0,.55);
}
.phone-screen {
  position: absolute;
  inset: 3px;
  border-radius: var(--radius-screen);
  background: var(--bg);
  overflow: hidden;
}
.status-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: var(--sb);
  z-index: 40;
  pointer-events: none;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding: 0 28px 8px;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.3px;
}
.island {
  position: absolute;
  top: 11px;
  left: 50%;
  transform: translateX(-50%);
  width: 126px;
  height: 37px;
  background: #000;
  border-radius: 20px;
  z-index: 41;
}
.status-right { display: flex; align-items: center; gap: 6px; }
.status-right svg { display: block; }

.app {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding-top: var(--sb);
  padding-bottom: var(--tb);
  overflow: hidden;
}
.app.no-tab { padding-bottom: 24px; }
.view {
  display: none;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 20px;
}
.view.on { display: block; }
#v-detail.view.on {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding-bottom: 0;
}
#v-detail .detail-scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}
.view.sheet { background: #000; }

/* Header */
.hdr {
  height: 52px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 16px;
  flex: none;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 8;
}
.hdr h1 { font-size: 17px; font-weight: 600; text-align: center; letter-spacing: 0.2px; }
.hdr-left, .hdr-right { display: flex; align-items: center; gap: 8px; }
.hdr-right { justify-content: flex-end; }
.ico-btn {
  width: 34px; height: 34px;
  border: 0; background: var(--elev);
  border-radius: 17px;
  color: var(--text);
  display: grid; place-items: center;
  cursor: pointer;
}
.ico-btn.ghost { background: transparent; }
.ico-btn.active { color: var(--green); background: var(--green-soft); }
.ico-btn.lg { width: 38px; height: 38px; border-radius: 19px; font-size: 20px; font-weight: 400; }
.back-pill {
  pointer-events: auto;
  height: 34px; padding: 0 14px;
  border: 0; border-radius: 17px;
  background: var(--elev);
  color: var(--text);
  font: inherit; font-size: 15px; font-weight: 500;
  cursor: pointer;
}

/* Tabs */
.seg {
  display: flex; justify-content: center; gap: 28px;
  padding: 4px 0 14px;
}
.seg button {
  border: 0; background: none; color: var(--dim);
  font: inherit; font-size: 15px; font-weight: 500;
  padding: 6px 14px; border-radius: 16px;
  cursor: pointer;
}
.seg button.on {
  background: var(--pill);
  color: var(--text);
  font-weight: 600;
}

/* Cards */
.pad { padding: 0 16px 16px; }
.card {
  background: var(--card);
  border-radius: 18px;
  padding: 14px 14px 14px 12px;
  margin-bottom: 10px;
}
.swipe-wrap {
  position: relative;
  margin-bottom: 10px;
  border-radius: 18px;
  overflow: hidden;
  background: #c4473c;
}
.swipe-del {
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 80px;
  border: 0; background: transparent;
  color: #fff;
  display: grid; place-items: center;
  cursor: pointer;
  z-index: 0;
}
.swipe-front {
  position: relative;
  z-index: 1;
  background: var(--card);
  touch-action: pan-y;
}
.swipe-front.card { margin-bottom: 0; }
.pick-lab {
  font-size: 12px;
  color: var(--muted);
  padding: 14px 8px 4px;
  letter-spacing: 0.3px;
}
.pick-item.sel { color: var(--green); font-weight: 600; }
.confirm-actions { display: flex; gap: 10px; padding: 4px 8px 8px; }
.confirm-btn {
  flex: 1; height: 46px; border: 0; border-radius: 14px;
  font: inherit; font-size: 16px; font-weight: 600;
  background: var(--elev); color: var(--text);
  cursor: pointer;
}
.confirm-btn.danger { background: #c4473c; color: #fff; }
.social {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 14px;
}
.social .av {
  width: 40px; height: 40px; border-radius: 20px;
  background: var(--green-soft);
  color: var(--green);
  display: grid; place-items: center;
  flex: none;
}
.social .t { font-size: 15px; font-weight: 600; }
.social .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
.social .chev { margin-left: auto; color: var(--dim); display: flex; gap: 10px; }

.tin {
  display: grid;
  grid-template-columns: 52px 1fr auto;
  gap: 12px;
  align-items: start;
}
.glyph {
  width: 52px; height: 52px; border-radius: 14px;
  background: var(--green);
  color: #14301a;
  font-size: 22px; font-weight: 600;
  display: grid; place-items: center;
  flex: none;
}
.glyph.soft { background: #5a8f6a; color: #dceee0; }
.tin-main { min-width: 0; padding-top: 1px; }
.tin-title {
  display: flex; align-items: baseline; gap: 6px;
}
.tin-title .name { font-size: 16px; font-weight: 600; }
.tin-title .cat { font-size: 13px; color: var(--muted); }
.maker { font-size: 13px; color: var(--muted); margin-top: 1px; }
.meta { font-size: 12.5px; color: #c5c9c0; margin-top: 8px; letter-spacing: 0.1px; }
.meta .ok { color: var(--green); font-weight: 500; }
.bar {
  height: 4px; border-radius: 2px;
  background: #3a3f38;
  margin-top: 8px; overflow: hidden;
}
.bar > i { display: block; height: 100%; background: #dfe6d8; border-radius: 2px; }
.tag {
  font-size: 11px; font-weight: 600;
  padding: 3px 8px; border-radius: 8px;
  background: #243328; color: var(--green);
  white-space: nowrap;
  margin-top: 4px;
}
.tag.idle { background: #2a2c28; color: #9aa094; }

/* FAB */
.fab {
  position: absolute;
  right: 22px; bottom: calc(var(--tb) + 18px);
  width: 58px; height: 58px; border-radius: 29px;
  background: var(--green-2);
  border: 0; color: #0d2414;
  box-shadow: 0 8px 24px rgba(95,184,126,.35);
  display: grid; place-items: center;
  cursor: pointer;
  z-index: 20;
}

/* Tab bar */
.tabbar {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: var(--tb);
  background: var(--nav);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  padding: 6px 6px 22px;
  z-index: 25;
  box-shadow: 0 -1px 0 rgba(255,255,255,.04);
}
.tabbar button {
  border: 0; background: none; color: #6d7268;
  font: inherit; font-size: 10px; font-weight: 500;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  cursor: pointer;
}
.tabbar button.on { color: var(--text); }
.tabbar button.on svg { stroke: var(--text); fill: none; }
.home-ind {
  position: absolute;
  bottom: 8px; left: 50%;
  transform: translateX(-50%);
  width: 134px; height: 5px;
  background: #3e423a;
  border-radius: 3px;
  z-index: 30;
}

/* Detail */
.hero {
  margin: 8px 16px 16px;
  height: 168px;
  border-radius: 22px;
  background: linear-gradient(180deg, #38563e 0%, #5a8c62 42%, #76b682 100%);
  display: grid; place-items: center;
  position: relative;
  overflow: hidden;
}
.hero .ch {
  font-size: 64px; font-weight: 500; color: #f3f7f1;
  letter-spacing: 2px;
  text-shadow: 0 2px 12px rgba(20,48,26,.15);
}
.hero .navs {
  position: absolute; inset: 0;
  pointer-events: none;
  padding: 12px 12px 0;
  display: flex; justify-content: space-between;
}
.hero .navs button { pointer-events: auto; background: rgba(20,30,20,.18); color: #f3f7f1; }
.detail-head { text-align: center; padding: 2px 16px 16px; }
.detail-head h2 { font-size: 22px; font-weight: 600; }
.detail-head .edit { display: inline; color: var(--dim); font-size: 16px; cursor: pointer; }
.detail-head .mk { color: var(--muted); font-size: 14px; margin-top: 4px; }
.detail-head .tag { display: inline-block; margin-top: 10px; }

.rows { padding: 0 16px; }
.row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 0;
  border-bottom: 1px solid #242820;
  font-size: 15px;
}
.row .l { display: flex; align-items: center; gap: 10px; color: var(--muted); }
.row .l svg { opacity: .85; }
.row .r { color: var(--text); font-weight: 400; }

.remain {
  margin: 18px 16px 8px;
  display: flex; align-items: center; justify-content: space-between;
}
.remain .lab { font-size: 13px; color: var(--muted); }
.remain .kg { font-size: 40px; font-weight: 500; letter-spacing: -1px; }
.remain .kg span { font-size: 18px; margin-left: 4px; font-weight: 500; }
.ring { width: 74px; height: 74px; position: relative; }
.ring svg { transform: rotate(-90deg); }
.ring .pct {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  font-size: 16px; font-weight: 600;
  color: var(--green);
}

.note-box {
  margin: 8px 16px 16px;
  background: var(--card);
  border-radius: 16px;
  padding: 14px 16px;
}
.note-box .lab { font-size: 13px; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; }

.dual {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 12px 16px 16px;
  position: relative;
  flex: none;
  margin: 0;
  background: var(--bg);
  z-index: 5;
}
.dual button {
  height: 48px; border: 0; border-radius: 24px;
  font: inherit; font-size: 16px; font-weight: 600;
  cursor: pointer;
}
.dual .ghost {
  background: var(--elev); color: var(--text);
}
.dual .prim {
  background: var(--green-2); color: #0d2414;
}

/* Bars / scores */
.bars { display: flex; flex-direction: column; gap: 14px; }
.bar-row { display: grid; grid-template-columns: 64px 1fr 28px; align-items: center; gap: 10px; }
.bar-row .bl { font-size: 13px; color: #d5d9d0; }
.bar-row .bv { font-size: 13px; font-weight: 600; color: var(--green); text-align: right; font-variant-numeric: tabular-nums; }
.track {
  height: 8px; background: #2c322b; border-radius: 4px; position: relative;
  cursor: pointer;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}
.track .fill {
  height: 100%; border-radius: 4px;
  background: linear-gradient(90deg, #4e8a5c, #76b682);
  width: 0%;
  pointer-events: none;
}
.track .thumb {
  position: absolute; top: 50%;
  width: 18px; height: 18px; border-radius: 50%;
  background: #e8eee4;
  box-shadow: 0 1px 4px rgba(0,0,0,.35);
  transform: translate(-50%, -50%);
  pointer-events: none;
}
.track.ro { cursor: default; }
.track.ro .thumb { display: none; }
.track.ro { height: 7px; }

.scale-hint {
  display: flex; justify-content: space-between;
  font-size: 10px; color: var(--dim);
  margin: 0 0 10px 74px;
  padding-right: 38px;
}

.method-chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
.chip {
  border: 0; background: var(--elev); color: var(--muted);
  font: inherit; font-size: 13px; font-weight: 500;
  padding: 7px 12px; border-radius: 16px; cursor: pointer;
}
.chip.on { background: var(--green-soft); color: var(--green); }

/* 陪你刷 */
.sheet-hdr {
  height: 56px;
  display: flex; align-items: center;
  padding: 0 16px;
}
.sheet-hdr h1 { flex: 1; text-align: center; font-size: 17px; font-weight: 600; margin-right: 8px; }
.field-block { padding: 6px 20px 14px; }
.field-label { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.field-row {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 22px; font-weight: 500;
}
.select-like {
  display: flex; align-items: center; gap: 4px;
  background: none; border: 0; color: var(--text);
  font: inherit; font-size: 22px; font-weight: 500;
  cursor: pointer;
}
.help { font-size: 13px; color: var(--muted); line-height: 1.55; margin-top: 8px; }
.sect {
  margin: 8px 16px 12px;
  background: var(--card);
  border-radius: 18px;
  padding: 16px;
}
.sect h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
.check {
  display: flex; align-items: flex-start; gap: 10px;
  font-size: 14px; color: var(--green);
  margin-top: 12px;
  cursor: pointer;
}
.check input { appearance: none; -webkit-appearance: none; width: 18px; height: 18px; margin-top: 1px; border: 1.5px solid #5a8f6a; border-radius: 4px; background: transparent; flex: none; }
.check input:checked { background: var(--green); border-color: var(--green); background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='none' stroke='%230d2414' stroke-width='2' d='M3 8l3.5 3.5L13 4'/></svg>"); background-size: 12px; background-repeat: no-repeat; background-position: center; }
.stepper-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0;
}
.stepper-row + .stepper-row { border-top: 1px solid #242820; }
.stepper-row .k { font-size: 16px; }
.stepper {
  display: flex; align-items: center; gap: 14px;
}
.stepper button {
  width: 28px; height: 28px; border-radius: 14px;
  border: 1.5px solid #5a5e56; background: none; color: var(--text);
  font-size: 18px; line-height: 1; cursor: pointer;
}
.stepper .n { min-width: 28px; text-align: center; font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
.stepper .u { color: var(--muted); font-size: 15px; margin-left: -6px; }
.stepper.grams-stepper { gap: 6px; }
.stepper.grams-stepper button {
  width: auto; min-width: 36px; height: 36px; padding: 0 6px;
  border-radius: 18px; font-size: 13px; font-weight: 600;
  font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
}
.stepper.grams-stepper .n { min-width: 36px; }
.stepper.grams-stepper .u { margin-left: 0; }
.toggle {
  width: 48px; height: 30px; border-radius: 15px;
  background: #3a3d38; border: 0; position: relative; cursor: pointer;
}
.toggle i {
  position: absolute; top: 2px; left: 2px;
  width: 26px; height: 26px; border-radius: 13px;
  background: #e8e8e8;
  transition: transform .2s;
}
.toggle.on { background: var(--green-2); }
.toggle.on i { transform: translateX(18px); }
.cta {
  margin: 18px 16px 28px;
  height: 54px; width: calc(100% - 32px);
  border: 0; border-radius: 27px;
  background: var(--green-2); color: #0d2414;
  font: inherit; font-size: 18px; font-weight: 600;
  cursor: pointer;
}
.seq { font-size: 13px; color: var(--muted); padding: 0 20px; }

/* 器具 */
.section-lab {
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--muted);
  padding: 8px 4px 10px;
}
.fav-tile {
  width: 48%;
  background: var(--card);
  border-radius: 16px;
  padding: 16px 12px 14px;
  text-align: left;
}
.fav-tile .ph {
  height: 88px;
  display: grid; place-items: center;
  color: #6a7268;
}
.fav-tile .nm { font-size: 13px; margin-top: 8px; color: #d0d4ca; }
.tool-row {
  display: flex; align-items: center; gap: 12px;
}
.tool-ico {
  width: 48px; height: 48px; border-radius: 12px;
  background: #2a2f28;
  display: grid; place-items: center;
  color: #c5c9c0;
}

/* 紀錄 list */
.rec-card { cursor: pointer; }
.rec-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.rec-top .ttl { font-size: 16px; font-weight: 600; }
.rec-top .dt { font-size: 12px; color: var(--muted); }
.rec-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }
.auto-sum { font-size: 13px; color: #c5c9c0; line-height: 1.5; margin: 10px 0 0; }

/* Modal / picker */
.mask {
  position: absolute; inset: 0; background: rgba(0,0,0,.5);
  z-index: 50; display: none;
}
.mask.on { display: block; }
.sheet-pick {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: #1c1f19;
  border-radius: 22px 22px 0 0;
  padding: 12px 16px 36px;
  z-index: 51;
  display: none;
  max-height: 70%;
  overflow: auto;
}
.sheet-pick.on { display: block; }
.grab { width: 36px; height: 4px; background: #3e423a; border-radius: 2px; margin: 0 auto 12px; }
.pick-item {
  width: 100%; text-align: left;
  background: none; border: 0; color: var(--text);
  font: inherit; font-size: 17px;
  padding: 14px 8px;
  border-bottom: 1px solid #2a2e28;
  cursor: pointer;
}
.form-grid { display: flex; flex-direction: column; gap: 10px; }
.inp {
  width: 100%; height: 44px;
  background: var(--elev); border: 0; border-radius: 12px;
  color: var(--text); font: inherit; font-size: 16px;
  padding: 0 14px; outline: none;
}
.price-row { display: flex; gap: 8px; align-items: stretch; }
.price-row .grow { flex: 1; min-width: 0; }
.price-row .curr { flex: 0 0 108px; }
.fx-actions { display: flex; gap: 8px; align-items: center; }
.fx-actions .grow { flex: 1; min-width: 0; }
.text-btn {
  border: 0; background: none; color: var(--green);
  font: inherit; font-size: 13px; font-weight: 600;
  cursor: pointer; white-space: nowrap; padding: 0 2px;
}
.fx-preview { font-size: 13px; color: var(--muted); line-height: 1.55; margin-top: 4px; }
select.inp { appearance: none; -webkit-appearance: none; background-image: none; }
.ta { height: auto; padding: 10px 14px; resize: none; min-height: 72px; }

/* Stats */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.stat {
  background: var(--card); border-radius: 16px; padding: 16px;
}
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-size: 26px; font-weight: 600; margin-top: 6px; }
.stat .v span { font-size: 14px; font-weight: 500; color: var(--muted); }

.empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; line-height: 1.6; }
.note-tag {
  display: inline-block; margin-top: 6px;
  font-size: 11px; font-weight: 600;
  padding: 2px 8px; border-radius: 8px;
  background: #2a2c28; color: #b7bbae;
}
.meta.warn, .ok.warn { color: #d4a09a !important; font-weight: 500; }
.flab { font-size: 12px; color: var(--muted); margin: 4px 2px 0; }
.tool-mini {
  border: 0; background: var(--elev); color: var(--text);
  font: inherit; font-size: 12px; font-weight: 500;

function load() {
  try {
    const raw = localStorage.getItem(STORE);
    if (raw) {

      if (data && Array.isArray(data.tins)) {
        const io = {};

      const raw = localStorage.getItem(STORE);

    } catch (err) {}
    setTimeout(() => toast("本機資料讀取失敗，已另外保留備份。而家顯示示範資料。"), 400);

}
function save() { localStorage.setItem(STORE, JSON.stringify(state)); }

function todayISO() {
  return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Hong_Kong", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
}
function toISODate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}
function parseISO(s) {
  const [y,m,dd] = s.split("-").map(Number);
  return new Date(y, m - 1, dd);
}
function fmtDMY(s) {
  if (!s) return "—";
  const [y,m,d] = s.split("-");
  return `${d}/${m}/${y}`;
}
function daysBetween(a, b) {
  return Math.round((parseISO(b) - parseISO(a)) / 86400000);
}
function r1(n) { return Math.round(Number(n) * 10) / 10; }
function r2(n) { return Math.round(Number(n) * 100) / 100; }
function r8(n) { return Math.round(Number(n) * 1e8) / 1e8; }

/* 顯示同輸入一律 dd/mm/yyyy；內部儲存保持 ISO yyyy-mm-dd */
function parseDMY(s) {
  const t = String(s || "").trim();
  if (!t) return "";
  const m = t.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
  if (!m) return null;
  const d = Number(m[1]), mo = Number(m[2]), y = Number(m[3]);
  if (mo < 1 || mo > 12 || d < 1 || d > 31 || y < 1900) return null;
  const dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
  return toISODate(dt);
}
function dateInputHtml(id, iso) {
  return `<input class="inp date-inp" id="${id}" type="text" inputmode="numeric" autocomplete="off" maxlength="10" enterkeyhint="done" placeholder="dd/mm/yyyy" value="${escAttr(iso ? fmtDMY(iso) : "")}" oninput="onDateFieldInput(this)" onkeydown="onDateFieldKeydown(event)">`;
}
function maskDateValue(raw) {
  const t = String(raw || "");
  const iso = parseDMY(t);
  if (iso) return fmtDMY(iso);
  const digits = t.replace(/\D/g, "").slice(0, 8);
  let out = digits.slice(0, 2);
  if (digits.length >= 2) out += "/";
  if (digits.length > 2) out += digits.slice(2, 4);
  if (digits.length >= 4) out += "/";
  if (digits.length > 4) out += digits.slice(4, 8);
  return out;
}
function dateCaretAfterDigits(masked, digitCount, atEnd) {
  if (atEnd || digitCount >= 8) return masked.length;
  if (digitCount <= 0) return 0;
  let pos = 0, seen = 0;
  while (pos < masked.length && seen < digitCount) {
    if (/\d/.test(masked.charAt(pos))) seen++;
    pos++;
  }
  if (masked.charAt(pos) === "/") pos++;
  return pos;
}
function onDateFieldInput(el) {
  if (!el) return;
  const prev = el.value;
  let caret = el.selectionStart;
  if (caret == null) caret = prev.length;
  const atEnd = caret >= prev.length;
  const digitsBefore = prev.slice(0, caret).replace(/\D/g, "").length;
  const masked = maskDateValue(prev);
  if (masked !== prev) el.value = masked;
  try {
    const pos = dateCaretAfterDigits(el.value, digitsBefore, atEnd);
    el.setSelectionRange(pos, pos);
  } catch (err) {}
}
function onDateFieldKeydown(ev) {
  const el = ev && ev.target;
  if (!el || ev.key !== "Backspace" || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (el.selectionStart !== el.selectionEnd) return;
  const pos = el.selectionStart;
  if (!(pos > 0 && el.value.charAt(pos - 1) === "/")) return;
  ev.preventDefault();
  const before = el.value.slice(0, pos - 1);
  const after = el.value.slice(pos);
  const cut = before.replace(/\d(?=[^\d]*$)/, "");
  el.value = cut + after;
  try { el.setSelectionRange(cut.length, cut.length); } catch (err) {}
  onDateFieldInput(el);
}
function readDateField(id, opts) {
  const el = document.getElementById(id);
  const raw = el ? el.value : "";
  const label = (opts && opts.label) || "日期";
  if (!String(raw).trim()) {
    if (opts && opts.required) { toast("請填寫" + label); return { error: true }; }
    return { iso: null };
  }
  const iso = parseDMY(raw);
  if (!iso) { toast(label + "格式請用 dd/mm/yyyy"); return { error: true }; }

function unitWeightOf(t) { return Number(t && (t.unitWeight != null ? t.unitWeight : t.weight)) || 0; }
function unitsTotalOf(t) { return Math.max(1, Number(t && t.unitsTotal) || 1); }
function totalGrams(t) { return r1(unitWeightOf(t) * unitsTotalOf(t)); }
function unitWord(t) { return t && t.packType === "sachet" ? "包" : "罐"; }
function isLotOpen(t) { return !!(t && (t.status === "inuse" || t.opened)); }
function isSealedLot(t) {
  if (!t) return true;
  if (t.status === "sealed" && !t.opened) return true;
  return !isLotOpen(t) && (Number(t.remaining) || 0) <= 0;
}
function lotGramsLeft(t) {
  const uw = unitWeightOf(t);
  const sealed = Number(t.unitsSealed) || 0;
  if (!isLotOpen(t)) {
    if (sealed > 0) return r1(sealed * uw);
    return r1(Number(t.remaining) || 0);
  }
  return r1(sealed * uw + (Number(t.remaining) || 0));
}
function usedInvGrams(t) { return r1(Math.max(0, totalGrams(t) - lotGramsLeft(t))); }
function lotSummary(t) {
  const uw = unitWeightOf(t);
  const sealed = Number(t.unitsSealed) || 0;
  const rem = Number(t.remaining) || 0;
  const u = unitWord(t);
  const total = unitsTotalOf(t);
  /* 舊資料未開封罐可能 remaining=單位重量，唔可以當成使用中 */
  if (!isLotOpen(t)) {
    const g = sealed > 0 ? r1(sealed * uw) : r1(rem || 0);
    if (t.packType === "sachet") return `剩 ${sealed} 包（${g} g）`;
    if (total === 1 && sealed <= 1) return "尚未開封";
    return `未開封 ${sealed} 罐（${g} g）`;
  }
  if (rem <= 0) {
    const g = r1(sealed * uw);
    if (t.packType === "sachet") return `剩 ${sealed} 包（${g} g）`;
    if (sealed > 0) return `未開 ${sealed} 罐（${g} g）`;
    return "已用完";
  }
  if (sealed > 0) return `使用中 1 ${u}（剩 ${rem} g）＋未開 ${sealed} ${u}`;
  if (t.packType === "sachet") return `使用中 1 包（剩 ${rem} g）`;
  if (total === 1) return `罐內剩 ${rem} g · 開封 ${openedDays(t)} 天`;
  return `使用中 1 罐（剩 ${rem} g）`;
}
function lotStatusTag(t) {
  if ((Number(t.remaining) || 0) <= 0 && (Number(t.unitsSealed) || 0) <= 0 && isLotOpen(t)) {
    return `<span class="tag idle">已用完</span>`;
  }
  return isSealedLot(t) ? `<span class="tag idle">未開封</span>` : `<span class="tag">使用中</span>`;
}
function canOpenNext(t) {
  const sealed = Number(t.unitsSealed) || 0;
  const rem = Number(t.remaining) || 0;
  if (sealed <= 0) return false;
  if (!isLotOpen(t) && rem > 0) return false; /* 舊資料：未開封但 remaining 已等於單位重量 */
  return rem <= 0;
}
/* 儲存刷茶時先確保有使用中單位。remaining 為 0 且仲有未開封時會自動開下一罐／包。startWhisk 唔會改庫存。 */
function beginUse(t, date) {
  const rem = Number(t.remaining) || 0;
  if (rem > 0) {
    if (t.status === "sealed" || !t.opened) {
      t.status = "inuse";
      if (!t.opened) t.opened = date || todayISO();
      const sealed = Number(t.unitsSealed) || 0;
      if (sealed > 0 && sealed + 1 > unitsTotalOf(t)) t.unitsSealed = Math.max(0, unitsTotalOf(t) - 1);
    }
    return "ok";
  }
  if ((Number(t.unitsSealed) || 0) > 0) {
    t.unitsSealed = (Number(t.unitsSealed) || 0) - 1;
    t.remaining = unitWeightOf(t);
    t.opened = date || todayISO();
    t.status = "inuse";
    return "opened";
  }
  return "empty";
}

/* fxRate = 港元／1日元（HKD per 1 JPY）。例如 0.05 即 1 日元 = HK$0.05。來源：Frankfurter api.frankfurter.dev */
const FX_API = "https://api.frankfurter.dev/v1/latest?from=JPY&to=HKD";
let fxFetchTimer = null;
let fxFetchGen = 0;
let fxFormEpoch = 0;
function invalidateFxFetch() {
  clearTimeout(fxFetchTimer);
  fxFetchTimer = null;
  fxFetchGen++;
}
function beginForm(fields) {
  invalidateFxFetch();
  ui.form = Object.assign({ epoch: ++fxFormEpoch }, fields);
}
function computeUnitPrices(amount, currency, totalG, fxRate) {
  const out = { yenPerG: 0, hkdPerG: 0, priceYen: 0 };
  const amt = Number(amount) || 0;
  const g = Number(totalG) || 0;
  const fx = Number(fxRate) || 0;
  if (!amt || !g) return out;
  if (currency === "HKD") {
    out.hkdPerG = r2(amt / g);
    out.yenPerG = fx ? r2(out.hkdPerG / fx) : 0;
    out.priceYen = fx ? Math.round(amt / fx) : 0;
  } else {
    out.yenPerG = r2(amt / g);
    out.hkdPerG = fx ? r2(out.yenPerG * fx) : 0;
    out.priceYen = amt;
  }
  return out;
}
function fmtMoney(currency, amount) {
  const n = Number(amount) || 0;
  if (currency === "HKD") return "HK$" + n.toLocaleString("en-HK", { maximumFractionDigits: 2 });
  return "¥" + n.toLocaleString("en-JP", { maximumFractionDigits: 0 });
}
function fetchFxRate(cb) {
  fetch(FX_API).then(r => {
    if (!r.ok) throw new Error("http");
    return r.json();
  }).then(data => {
    const rate = data && data.rates && Number(data.rates.HKD);
    if (!rate) throw new Error("bad");
    cb(null, { rate: r8(rate), at: data.date || todayISO() });
  }).catch(err => cb(err || new Error("fail")));
}
function fillFxField(rate, at, source) {
  const el = document.getElementById("f-fxRate");
  const atEl = document.getElementById("f-fxRateAt");
  const srcEl = document.getElementById("f-fxSource");
  if (el) el.value = String(rate);
  if (atEl) atEl.value = at || todayISO();
  if (srcEl) srcEl.value = source || "live";
  updatePricePreview();
}
function requestLiveFx(force) {
  const srcEl = document.getElementById("f-fxSource");
  if (!force && srcEl && srcEl.value === "saved") return;
  clearTimeout(fxFetchTimer);
  const gen = ++fxFetchGen;
  const epoch = ui.form && ui.form.epoch;
  const allowRefresh = !!force;
  fxFetchTimer = setTimeout(() => {
    fetchFxRate((err, data) => {
      if (gen !== fxFetchGen) return;
      if (!ui.form || ui.form.epoch !== epoch) return;
      const src = document.getElementById("f-fxSource");
      const source = src ? src.value : "";
      if (err) {
        if (source !== "saved" && source !== "manual") {
          if (src) src.value = "manual";
          toast("未能取得即時匯率，請自行填寫（港元／1日元）");
        }
        return;
      }
      if (source === "manual") return;
      if (source === "saved" && !allowRefresh) return;
      fillFxField(data.rate, data.at, "live");
    });
  }, 280);
}
function refreshFxRate() {
  const src = document.getElementById("f-fxSource");
  if (src) src.value = "live";
  requestLiveFx(true);
}
function updatePricePreview() {
  const box = document.getElementById("f-pricePreview");
  if (!box) return;
  const amtRaw = (document.getElementById("f-priceAmount") || {}).value;
  const currency = (document.getElementById("f-priceCurrency") || {}).value || "JPY";
  const fxRaw = (document.getElementById("f-fxRate") || {}).value;
  const at = (document.getElementById("f-fxRateAt") || {}).value;
  const uw = Number((document.getElementById("f-unitWeight") || {}).value);
  const ut = Number((document.getElementById("f-unitsTotal") || {}).value);
  const totalG = (uw > 0 && ut > 0) ? r1(uw * ut) : 0;
  const amt = amtRaw === "" || amtRaw == null ? 0 : Number(amtRaw);
  const fx = fxRaw === "" || fxRaw == null ? 0 : Number(fxRaw);
  if (!amt || !totalG) {
    box.textContent = totalG ? `總重量 ${totalG} g。填寫金額後會自動計每克單價。` : "填寫每單位重量同購入數量後，會按整批總克數計每克單價。";
    return;
  }
  if (!fx) {
    box.textContent = "請填寫或更新匯率（港元／1日元），先可以同時計港元同日元每克單價。";
    return;
  }
  const p = computeUnitPrices(amt, currency, totalG, fx);
  const when = at ? fmtDMY(at) : "—";
  box.textContent = `每克 HK$${p.hkdPerG.toFixed(2)} · ¥${p.yenPerG}（總 ${totalG} g；匯率 1 日元 = HK$${fx}，${when}）`;
}

function migrateTin(t) {
  if (!t || typeof t !== "object") return t;
  if (t.packType == null) {
    t.packType = "tin";
    t.unitWeight = t.weight;
    t.unitsTotal = 1;
    t.unitsSealed = t.status === "sealed" ? 1 : 0;
  } else {
    if (t.unitWeight == null && t.weight != null) t.unitWeight = t.weight;
    if (t.unitsTotal == null) t.unitsTotal = 1;
    if (t.unitsSealed == null) t.unitsSealed = t.status === "sealed" ? (t.unitsTotal || 1) : 0;
  }
  if (t.weight == null && t.unitWeight != null) t.weight = t.unitWeight;
  if (t.priceCurrency == null) {
    t.priceCurrency = "JPY";
    t.priceAmount = t.priceYen || 0;
    if (t.yenPerG && t.hkdPerG) t.fxRate = r8(Number(t.hkdPerG) / Number(t.yenPerG));
    if (t.fxRateAt == null && t.acquired) t.fxRateAt = t.acquired;
  }
  return t;
}
function migrateTool(u) {
  if (!u || typeof u !== "object") return u;
  if (u.acquired == null) u.acquired = "";
  if (u.opened === undefined) u.opened = null;
  return u;
}
function toolUsedLabel(u) {
  if (!u || !u.opened) return "未開封";
  return "已使用 " + daysBetween(u.opened, todayISO()) + " 天";
}

function openedDays(tin) {
  if (!tin.opened) return 0;
  return daysBetween(tin.opened, todayISO());
}
function bestLeft(tin) {
  if (!tin.opened) return null;
  const end = parseISO(tin.opened);
  end.setDate(end.getDate() + tin.bestDays);
  const endS = toISODate(end);
  return { date: endS, left: daysBetween(todayISO(), endS) };
}
function tinBy(id) { return state.tins.find(t => t.id === id); }
function toast(msg) {
  const el = document.getElementById("toast");

}

/* ---------- 抹茶櫃 ---------- */
function renderCabinet() {
  const el = document.getElementById("v-cabinet");
  const tab = ui.cabTab;
  let body = "";
  if (tab === "matcha") {
    let tins = state.tins.slice();
    if (ui.tinFilter === "inuse") tins = tins.filter(t => !isSealedLot(t));
    if (ui.tinFilter === "sealed") tins = tins.filter(t => isSealedLot(t));
    if (ui.tinSort === "expiry") {
      tins.sort((a, b) => {
        const al = bestLeft(a), bl = bestLeft(b);
        const av = al ? al.left : 99999, bv = bl ? bl.left : 99999;
        return av - bv;
      });
    } else if (ui.tinSort === "remain") {
      tins.sort((a, b) => lotGramsLeft(a) - lotGramsLeft(b));
    } else if (ui.tinSort === "name") {
      tins.sort((a, b) => a.name.localeCompare(b.name, "zh-Hant"));
    }
    body += `<div class="pad">`;
    if (!tins.length) body += `<div class="empty">沒有符合篩選的抹茶。</div>`;
    tins.forEach(t => { body += tinCard(t); });
    body += `</div>`;
  } else if (tab === "tools") {
    const favs = state.utensils.filter(u => u.fav);
    const rest = state.utensils.filter(u => !u.fav);
    const kinds = [];
    rest.forEach(u => {
      const k = u.kind || "其他";
      if (!kinds.includes(k)) kinds.push(k);
    });
    body += `<div class="pad">`;
    body += `<div class="section-lab">${ico.star} 收藏櫃</div>`;
    if (!favs.length) body += `<div class="help" style="margin:0 0 18px">未有收藏。可喺器具列上標為收藏。</div>`;
    else body += `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px">${favs.map(favTile).join("")}</div>`;
    if (!rest.length && !favs.length) body += `<div class="empty">還沒有器具。</div>`;
    kinds.forEach(k => {
      body += `<div class="section-lab">✎ ${escHtml(k)}</div>`;
      rest.filter(u => (u.kind || "其他") === k).forEach(u => { body += toolRow(u); });
    });
    body += `</div>`;
  } else {
    if (!state.recipes.length) {
      body += `<div class="empty">還沒有茶譜。<br>可撳右上角新增，或喺陪你刷時儲存目前設定。</div>`;
    } else {
      body += `<div class="pad">` + state.recipes.map(recipeCard).join("") + `</div>`;
    }
  }
  const filterOn = ui.tinFilter !== "all" || ui.tinSort !== "default";
  el.innerHTML = `
    <div class="hdr">
      <div class="hdr-left"></div>
      <h1>${tab === "tools" ? "器具櫃" : tab === "recipes" ? "配方" : "抹茶櫃"}</h1>
      <div class="hdr-right">
        ${tab === "matcha" ? `<button class="ico-btn${filterOn ? " active" : ""}" aria-label="篩選" onclick="openFilter()">${ico.sliders}</button>` : ""}
        <button class="ico-btn" aria-label="新增" onclick="openAdd('${tab}')">＋</button>
      </div>
    </div>
    <div class="seg">
      <button class="${tab==="matcha"?"on":""}" onclick="ui.cabTab='matcha';renderCabinet()">抹茶</button>
      <button class="${tab==="tools"?"on":""}" onclick="ui.cabTab='tools';renderCabinet()">器具</button>
      <button class="${tab==="recipes"?"on":""}" onclick="ui.cabTab='recipes';renderCabinet()">配方</button>
    </div>
    ${body}`;
  show("v-cabinet");
  bindSwipe(el);
}

function tinCard(t) {
  const od = openedDays(t);

  let meta = "";
  if (isSealedLot(t)) meta = `<div class="meta">${escHtml(lotSummary(t))}</div>`;
  else {
    const expired = bl && bl.left < 0;
    const ok = bl && bl.left >= 0;
    const taste = !bl ? ""
      : expired
        ? `<div class="meta warn">已過賞味期 ${-bl.left} 天</div>`
        : `<div class="meta ok" style="color:var(--green);margin-top:3px">距賞味日期還有 ${bl.left} 天</div>`;
    const barPct = expired ? 0 : Math.max(8, Math.min(100, bl && bl.left > 0 ? (bl.left / t.bestDays) * 100 : 0));
    meta = `<div class="meta">${escHtml(lotSummary(t))}</div>
      ${taste}
      <div class="bar"><i style="width:${barPct}%"></i></div>`;

  return `<div class="swipe-wrap" data-kind="tin" data-id="${escAttr(t.id)}">

      </div>
      ${status}
    </div>
  </div>`;
}

function closeAllSwipes() {

    if (f) { f.style.transition = "transform .22s ease"; f.style.transform = "translateX(0)"; }
  });
}
function bindSwipe(container) {
  const REVEAL = 80;
  container.querySelectorAll(".swipe-wrap").forEach(wrap => {
    const front = wrap.querySelector(".swipe-front");
    if (!front) return;
    let x0 = 0, y0 = 0, startX = 0, dx = 0, mode = 0, moved = false;
    const isOpen = () => wrap.classList.contains("open");
    const setX = (x, animate) => {
      front.style.transition = animate ? "transform .22s ease" : "none";
      front.style.transform = "translateX(" + x + "px)";
    };
    const isInnerControl = ev => {
      const hit = ev.target && ev.target.nodeType === 1 ? ev.target : (ev.target && ev.target.parentElement);
      return !!(hit && hit.closest && hit.closest(".swipe-front button, .swipe-front a, .swipe-front input, .swipe-front select, .swipe-front textarea"));
    };
    const onDown = e => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      if (isInnerControl(e)) return;
      x0 = e.clientX; y0 = e.clientY;
      startX = isOpen() ? -REVEAL : 0;
      dx = startX; mode = 0; moved = false;
      front.style.transition = "none";
      try { front.setPointerCapture(e.pointerId); } catch (err) {}
    };
    const onMove = e => {
      if (!x0 && !y0) return;
      const mx = e.clientX - x0, my = e.clientY - y0;
      if (mode === 0) {
        if (Math.abs(mx) + Math.abs(my) < 8) return;
        mode = Math.abs(mx) > Math.abs(my) * 1.15 ? 1 : 2;
        if (mode === 1) closeAllSwipes();
      }
      if (mode !== 1) return;
      e.preventDefault();
      moved = true;
      dx = Math.max(-REVEAL - 28, Math.min(20, startX + mx));
      if (dx > 0) dx = dx * 0.15;
      setX(dx, false);
    };
    const onUp = () => {
      if (mode === 1) {
        const open = dx < -REVEAL * 0.4;
        wrap.classList.toggle("open", open);
        setX(open ? -REVEAL : 0, true);
      }
      mode = 0; x0 = 0; y0 = 0;
    };
    front.addEventListener("pointerdown", onDown);
    front.addEventListener("pointermove", onMove);
    front.addEventListener("pointerup", onUp);
    front.addEventListener("pointercancel", onUp);
    front.addEventListener("click", e => {
      if (isInnerControl(e)) return;
      if (isOpen() || moved) {
        e.preventDefault();
        e.stopPropagation();
        if (isOpen()) {
          wrap.classList.remove("open");
          setX(0, true);
        }
        moved = false;
        return;
      }
      const fn = front.getAttribute("data-open");
      if (fn) {
        const m = fn.match(/^(\w+)\('([^']*)'\)$/);
        if (m && typeof window[m[1]] === "function") window[m[1]](m[2]);
      }
    }, true);
    const del = wrap.querySelector(".swipe-del");
    if (del) {
      let armed = 0;
      const requestDel = ev => {
        ev.preventDefault();
        ev.stopPropagation();
        const now = Date.now();
        if (now - armed < 400) return;
        armed = now;
        askDelete(wrap.dataset.kind, wrap.dataset.id);
      };
      del.addEventListener("pointerup", ev => {
        if (ev.pointerType === "mouse" && ev.button !== 0) return;
        requestDel(ev);
      });
      del.addEventListener("click", requestDel);
    }
  });
}

function bindTracks(root, scores, onChange) {

      const x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - rect.left;
      let v = Math.round((x / rect.width) * 10);

  else if (nori != null) parts.push(`紫菜味${word(nori, DIMS[3])}`);
  if (bitter <= 3 && ast <= 3) parts.push("唔苦唔澀");
  else {
    if (bitter != null) parts.push(bitter <= 3 ? "唔苦" : `苦味${word(bitter, DIMS[1])}`);
    if (ast != null) parts.push(ast <= 3 ? "唔澀" : `澀味${word(ast, DIMS[2])}`);

  if (grassy <= 3) parts.push("草青味唔重");
  else if (grassy) parts.push(`草青味${word(grassy, DIMS[4])}`);
  if (matcha >= 7) parts.push("抹茶香突出");
  if (finish >= 6) parts.push("有回甘");

    const sealed0 = Number(t.unitsSealed) || 0;

    if (rem0 <= 0 && sealed0 <= 0) { toast("已經用完，請先開下一" + unitWord(t) + "或更新庫存"); return; }
    if (rem0 <= 0 && sealed0 > 0 && uw < grams) { toast("下一" + unitWord(t) + "只有 " + uw + " g，不夠今次用量"); return; }
    const snap = { remaining: t.remaining, unitsSealed: t.unitsSealed, opened: t.opened, status: t.status };
    const opened = beginUse(t, rec.date);
    if (opened === "empty" || (Number(t.remaining) || 0) < grams) {
      t.remaining = snap.remaining;
      t.unitsSealed = snap.unitsSealed;
      t.opened = snap.opened;
      t.status = snap.status;
      if (opened === "empty") toast("已經用完，請先開下一" + unitWord(t) + "或更新庫存");
      else toast("剩餘只有 " + (Number(t.remaining) || 0) + " g，不夠今次用量");
      return;
    }
    t.remaining = r1(t.remaining - grams);
    if (t.remaining < 0) t.remaining = 0;
    autoOpened = opened === "opened";
    rec.independent = false;
    rec.grams = grams;
    rec.waterMl = Number(r.waterMl) || 0;

    state.sessions.push({

      tinId: t.id,

  } else {

  }
  const from = r.from;

  ui.rate = null;

function assignSafeIds(list, io) {
  const map = Object.create(null);
  const used = new Set();
  const items = Array.isArray(list) ? list : [];
  for (const item of items) {
    if (!item || typeof item !== "object") continue;
    const raw = item.id == null ? "" : String(item.id);
    if (raw !== "" && Object.prototype.hasOwnProperty.call(map, raw)) {
      item.id = map[raw];
      continue;
    }
    let next = isSafeId(raw) ? raw : "";
    if (!next) {
      do { next = uid(); } while (used.has(next));
      if (io) io.rewritten = (io.rewritten || 0) + 1;
    }
    if (raw !== "") map[raw] = next;
    used.add(next);
    item.id = next;
  }
  return map;
}
function rewriteRef(obj, key, map, io) {
  if (!obj || obj[key] == null || obj[key] === "") return;
  const raw = String(obj[key]);
  if (Object.prototype.hasOwnProperty.call(map, raw)) obj[key] = map[raw];
  else if (!isSafeId(raw)) {
    obj[key] = "";
    if (io) io.rewritten = (io.rewritten || 0) + 1;
  }
}
function normalizeState(data, io) {
  const tins = (Array.isArray(data.tins) ? data.tins : []).map(migrateTin);
  const utensils = (Array.isArray(data.utensils) ? data.utensils : []).map(migrateTool);
  const recipes = Array.isArray(data.recipes) ? data.recipes.slice() : [];
  const records = Array.isArray(data.records) ? data.records.slice() : [];
  const sessions = Array.isArray(data.sessions) ? data.sessions.slice() : [];
  const tinMap = assignSafeIds(tins, io);
  assignSafeIds(utensils, io);
  assignSafeIds(recipes, io);
  const recordMap = assignSafeIds(records, io);
  assignSafeIds(sessions, io);
  for (const r of recipes) rewriteRef(r, "tinId", tinMap, io);
  for (const r of records) rewriteRef(r, "tinId", tinMap, io);
  for (const s of sessions) {
    rewriteRef(s, "tinId", tinMap, io);
    rewriteRef(s, "recordId", recordMap, io);
  }
  return { tins, utensils, recipes, records, sessions };
}

function saveTinForm() {
  const name = (document.getElementById("f-name").value || "").trim();
  if (!name) { toast("請填寫銘柄"); return; }
  const acq = readDateField("f-acquired", { label: "入手日" });
  if (acq.error) return;
  const op = readDateField("f-opened", { label: "開封日" });
  if (op.error) return;
  const packType = document.getElementById("f-packType").value === "sachet" ? "sachet" : "tin";
  const uwRaw = document.getElementById("f-unitWeight").value;
  if (uwRaw === "" || Number(uwRaw) <= 0) { toast(packType === "sachet" ? "請填寫每包重量" : "請填寫每罐重量"); return; }
  const unitWeight = r1(uwRaw);
  const utRaw = document.getElementById("f-unitsTotal").value;
  const unitsTotal = parseInt(utRaw, 10);
  if (utRaw === "" || !Number.isFinite(unitsTotal) || unitsTotal < 1) { toast("請填寫購入數量"); return; }
  const remRaw = document.getElementById("f-remaining").value;
  const sealedRaw = document.getElementById("f-unitsSealed").value;
  let opened = op.iso || null;
  let remaining, unitsSealed, status;
  const openedEmpty = !opened;
  const remEmpty = remRaw === "";
  const remNum = remEmpty ? 0 : r1(remRaw);
  if (remNum < 0) { toast("剩餘不能小於 0"); return; }
  if (remNum > unitWeight) { toast("使用中剩餘不能超過每" + (packType === "sachet" ? "包" : "罐") + "重量"); return; }
  if (openedEmpty && (remEmpty || remNum === 0)) {
    remaining = 0;
    unitsSealed = sealedRaw === "" ? unitsTotal : Math.max(0, Math.min(unitsTotal, parseInt(sealedRaw, 10) || 0));
    status = "sealed";
    opened = null;
  } else {
    remaining = remEmpty ? unitWeight : remNum;
    if (!opened) opened = todayISO();
    const maxSealed = remaining > 0 ? unitsTotal - 1 : unitsTotal;
    if (sealedRaw === "") {
      unitsSealed = remaining > 0 ? Math.max(0, unitsTotal - 1) : (unitsTotal === 1 ? 0 : Math.max(0, unitsTotal - 1));
    } else {
      unitsSealed = Math.max(0, Math.min(maxSealed, parseInt(sealedRaw, 10) || 0));
    }
    status = "inuse";
  }
  const bestDaysRaw = document.getElementById("f-bestDays").value;
  const amtRaw = document.getElementById("f-priceAmount").value;
  const priceAmount = amtRaw === "" ? 0 : Number(amtRaw) || 0;
  const priceCurrency = document.getElementById("f-priceCurrency").value === "HKD" ? "HKD" : "JPY";
  const fxRaw = document.getElementById("f-fxRate").value;
  let fxRate = fxRaw === "" ? 0 : Number(fxRaw) || 0;
  let fxRateAt = document.getElementById("f-fxRateAt").value || "";
  if (priceAmount && !fxRate) { toast("請填寫或更新匯率，先可以計每克單價"); return; }
  if (priceAmount && fxRate && !fxRateAt) fxRateAt = todayISO();
  if (!priceAmount) { fxRate = fxRate || 0; }
  const priced = computeUnitPrices(priceAmount, priceCurrency, unitWeight * unitsTotal, fxRate);
  const rec = {
    id: ui.form && ui.form.id ? ui.form.id : uid(),
    name,
    maker: (document.getElementById("f-maker").value || "").trim(),
    char: (document.getElementById("f-char").value || "").trim() || name[0],
    cat: (document.getElementById("f-cat").value || "").trim() || "抹茶",
    acquired: acq.iso || todayISO(),
    packType,
    unitWeight,
    unitsTotal,
    unitsSealed,
    weight: unitWeight,
    remaining,
    opened,
    bestDays: bestDaysRaw === "" ? 90 : Math.max(1, Number(bestDaysRaw) || 90),
    status,
    priceAmount,
    priceCurrency,
    fxRate: fxRate ? r8(fxRate) : 0,
    fxRateAt: priceAmount && fxRate ? fxRateAt : (fxRateAt || null),
    priceYen: priced.priceYen,
    yenPerG: priced.yenPerG,
    hkdPerG: priced.hkdPerG
  };
  const idx = state.tins.findIndex(x => x.id === rec.id);
  if (idx >= 0) state.tins[idx] = Object.assign({}, state.tins[idx], rec);
  else state.tins.push(rec);
  if (!ui.whisk.tinId) ui.whisk.tinId = rec.id;
  save();
  if (idx < 0) {
    invalidateFxFetch();
    ui.form = null;
    ui.cabTab = "matcha";
    renderCabinet();
    toast("已新增");
  } else {
    closeForm();
    toast("已更新");
  }
}

function openEditTool(id) {
  const u = id ? state.utensils.find(x => x.id === id) : null;
  beginForm({ id: u ? u.id : null, from: "cabinet", cabTab: "tools" });
  const el = document.getElementById("v-add");
  el.innerHTML = formShell(u ? "編輯器具" : "新增器具", `
    <div class="field-label">名稱</div>
    <input class="inp" id="f-name" value="${escAttr(u ? u.name : "")}" placeholder="例如 數穗">
    <div class="field-label">職人／品牌</div>
    <input class="inp" id="f-maker" value="${escAttr(u ? (u.maker || "") : "")}">
    <div class="field-label">種類</div>
    <input class="inp" id="f-kind" value="${escAttr(u ? (u.kind || "茶筅") : "茶筅")}" placeholder="茶筅／茶杓／茶碗">
    <div class="field-label">購入日（選填）</div>
    ${dateInputHtml("f-acquired", u && u.acquired ? u.acquired : "")}
    <div class="field-label">開封日（選填，空白＝未開封）</div>
    ${dateInputHtml("f-opened", u && u.opened ? u.opened : "")}
    <div class="field-label">狀態</div>
    <select class="inp" id="f-status" onchange="onToolStatusChange(this)">
      <option value=""${!u || u.status!=="inuse"?" selected":""}>閒置</option>
      <option value="inuse"${u && u.status==="inuse"?" selected":""}>使用中</option>
    </select>
    <label class="check"><input type="checkbox" id="f-fav" ${u && u.fav ? "checked" : ""}> 加入收藏櫃</label>
  `, "saveToolForm()");
  show("v-add");
}
function onToolStatusChange(sel) {
  if (!sel || sel.value !== "inuse") return;
  const el = document.getElementById("f-opened");
  if (el && !String(el.value).trim()) el.value = fmtDMY(todayISO());
}
function saveToolForm() {
  const name = (document.getElementById("f-name").value || "").trim();
  if (!name) { toast("請填寫名稱"); return; }
  const acq = readDateField("f-acquired", { label: "購入日" });
  if (acq.error) return;
  const op = readDateField("f-opened", { label: "開封日" });
  if (op.error) return;
  const status = document.getElementById("f-status").value;
  let opened = op.iso || null;
  if (status === "inuse" && !opened) opened = todayISO();
  const rec = {
    id: ui.form && ui.form.id ? ui.form.id : uid(),
    name,
    maker: (document.getElementById("f-maker").value || "").trim(),
    kind: (document.getElementById("f-kind").value || "").trim() || "其他",
    status,
    fav: document.getElementById("f-fav").checked,
    acquired: acq.iso || "",
    opened
  };
  const idx = state.utensils.findIndex(x => x.id === rec.id);
  if (idx >= 0) state.utensils[idx] = Object.assign({}, state.utensils[idx], rec);
  else state.utensils.push(rec);
  save();
  invalidateFxFetch();
  ui.form = null;
  ui.cabTab = "tools";
  renderCabinet();
  toast(idx >= 0 ? "已更新" : "已新增");
}

function openEditRecipe(id) {
  const r = id ? state.recipes.find(x => x.id === id) : null;
  if (!state.tins.length) { toast("請先加入一罐抹茶，再新增茶譜"); return; }
  beginForm({ id: r ? r.id : null, from: "cabinet", cabTab: "recipes" });
  const tinOpts = state.tins.map(t => `<option value="${escAttr(t.id)}"${r && r.tinId===t.id?" selected":(!r && t.id===ui.whisk.tinId?" selected":"")}>${escHtml(t.name)}</option>`).join("");
  const methodOpts = METHODS.map(m => `<option value="${escAttr(m)}"${(r ? r.method : "薄茶純飲")===m?" selected":""}>${escHtml(m)}</option>`).join("");
  const el = document.getElementById("v-add");
  el.innerHTML = formShell(r ? "編輯茶譜" : "新增茶譜", `
    <div class="field-label">名稱</div>
    <input class="inp" id="f-name" value="${escAttr(r ? r.name : "")}" placeholder="例如 雲鶴日常">
    <div class="field-label">抹茶</div>
    <select class="inp" id="f-tinId">${tinOpts}</select>
    <div class="field-label">沖法</div>
    <select class="inp" id="f-method">${methodOpts}</select>
    <div class="field-label">用量（g）</div>
    <input class="inp" id="f-grams" type="number" inputmode="decimal" step="0.5" min="0.5" value="${escAttr(r ? r.grams : 2)}">
    <div class="field-label">水量（ml）</div>
    <input class="inp" id="f-water" type="number" inputmode="numeric" step="1" min="10" value="${escAttr(r ? r.water : 70)}">
    <div class="field-label">水溫（°C，選填）</div>
    <input class="inp" id="f-temp" type="number" inputmode="numeric" step="1" min="40" max="100" value="${escAttr(r && r.temp != null ? r.temp : "")}" placeholder="可留空">
  `, "saveRecipeForm()");
  show("v-add");
}
function saveRecipeForm() {
  const name = (document.getElementById("f-name").value || "").trim();
  if (!name) { toast("請填寫名稱"); return; }
  const tinId = document.getElementById("f-tinId").value;
  if (!tinBy(tinId)) { toast("請選擇抹茶"); return; }
  const grams = Math.max(0.5, Number(document.getElementById("f-grams").value) || 0.5);
  const water = Math.max(10, Number(document.getElementById("f-water").value) || 10);
  const tempRaw = document.getElementById("f-temp").value;
  const rec = {
    id: ui.form && ui.form.id ? ui.form.id : uid(),
    name,
    tinId,
    method: document.getElementById("f-method").value || "不指定",
    grams: Math.round(grams * 10) / 10,
    water,
    temp: tempRaw === "" ? null : Number(tempRaw)
  };
  const idx = state.recipes.findIndex(x => x.id === rec.id);
  if (idx >= 0) state.recipes[idx] = rec;
  else state.recipes.push(rec);
  save();
  invalidateFxFetch();
  ui.form = null;
  ui.cabTab = "recipes";
  renderCabinet();
  toast(idx >= 0 ? "已更新" : "已新增");
}

document.getElementById("import-file").addEventListener("change", ev => {
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  if (f) readImportFile(f);
});
try {
  renderCabinet();
} catch (err) {
  const el = document.getElementById("v-cabinet");
  if (el) el.innerHTML = '<div class="js-fallback">載入失敗。請用 Safari 重新開啟此檔。</div>';
}
</script>
</body>
</html>
